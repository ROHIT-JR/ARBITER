version: '3.8'

services:
  arbiter-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbiter-api
    ports:
      - "8000:8000"
    environment:
      - ARBITER_DATA_DIR=/data
      - PORT=8000
    volumes:
      - arbiter-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  arbiter-data:
    driver: local
