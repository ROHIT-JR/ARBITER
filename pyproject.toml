[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-qds"
version = "0.1.0"
description = "Unified, Neyman-Pearson attack attribution for teleportation-based quantum digital signatures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Team F0rg3d (SIH26-A0H-T043)" }]
keywords = ["quantum", "digital-signatures", "qds", "qiskit", "hypothesis-testing", "post-quantum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "dilithium-py>=1.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
sdp = ["cvxpy>=1.4"]
dev = ["pytest>=8", "httpx>=0.27", "arbiter-qds[api,sdp]"]

[project.urls]
Repository = "https://github.com/ROHIT-JR/ARBITER"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical or Qiskit-circuit tests that take several seconds"]
