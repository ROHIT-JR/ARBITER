[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-qds"
version = "0.1.0"
description = "Unified, Neyman-Pearson attack attribution for teleportation-based quantum digital signatures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Team F0rg3d (SIH26-A0H-T043)" }]
keywords = ["quantum", "digital-signatures", "qds", "qiskit", "hypothesis-testing", "post-quantum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "dilithium-py>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
api = []
sdp = ["cvxpy>=1.4"]
pki = ["cryptography>=42"]
notebooks = ["jupyter>=1", "matplotlib>=3.8", "pandas>=2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6", "matplotlib>=3.8", "pandas>=2", "arbiter-qds[api,sdp,pki]"]

[project.urls]
Repository = "https://github.com/ROHIT-JR/ARBITER"

[project.scripts]
arbiter = "arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbiter = ["demo_scenarios.json", "dashboard/*.html", "dashboard/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical or Qiskit-circuit tests that take several seconds"]

[tool.coverage.run]
source = ["arbiter"]
# The gate targets deterministic protocol/security code.  Network, process,
# hardware, and persistence adapters are still exercised by the regular test
# matrix, but are excluded because their branch coverage depends on external
# runtimes rather than the property-testable core.
omit = [
    "src/arbiter/api/*",
    "src/arbiter/cli.py",
    "src/arbiter/demo.py",
    "src/arbiter/pipeline.py",
    "src/arbiter/storage.py",
    "src/arbiter/detection/baseline.py",
    "src/arbiter/pki_risk_scoring/certificates.py",
    "src/arbiter/pki_risk_scoring/chain.py",
    "src/arbiter/pki_risk_scoring/scan.py",
    "src/arbiter/qds_simulation/circuits.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["arbiter"]
