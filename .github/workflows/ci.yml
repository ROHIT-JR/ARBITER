name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  coverage:
    name: core coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Enforce deterministic-core coverage
        run: >-
          pytest -q -m "not slow"
          tests/test_properties.py tests/test_detection.py tests/test_ledger.py
          tests/test_noise.py tests/test_pki.py tests/test_quantum.py tests/test_simulation.py
          tests/test_visibility.py
          --cov=arbiter --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov --cov-fail-under=90
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Execute demo notebook
        run: python notebooks/build_demo.py
      - name: Run example sweep (smoke)
        run: python examples/attack_sweep.py --sessions 5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run sync:demo
      - name: Assert all built dashboard assets make no external requests
        run: >-
          node --input-type=module -e 'import { readdirSync, readFileSync } from "node:fs"; import { join } from "node:path"; const walk = (dir) => readdirSync(dir, { withFileTypes: true }).flatMap((entry) => entry.isDirectory() ? walk(join(dir, entry.name)) : [join(dir, entry.name)]); const external = "(?:https?:)?\\/\\/(?!127\\.0\\.0\\.1(?::\\d+)?(?:\\/|$)|localhost(?::\\d+)?(?:\\/|$))"; for (const file of walk("dist").filter((path) => /\.(html|css|js)$/.test(path))) { const body = readFileSync(file, "utf8"); const pattern = file.endsWith(".js") ? new RegExp(`(?:fetch|sendBeacon|open|WebSocket)\\s*\\(\\s*["\x27]${external}`, "i") : new RegExp(external, "i"); if (pattern.test(body)) throw new Error(`dashboard asset makes an external request: ${file}`); }'
      - name: Assert packaged dashboard assets are current
        run: git diff --exit-code -- src/arbiter/dashboard
